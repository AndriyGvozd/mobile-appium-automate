name: CI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          APPIUM_SKIP_CHROMEDRIVER_INSTALL: 1

      - name: TypeScript type check
        run: npx tsc --noEmit

  test-browserstack-android:
    name: BrowserStack Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-typecheck
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          APPIUM_SKIP_CHROMEDRIVER_INSTALL: 1

      - name: Verify Appium installation
        run: |
          npx appium --version
          npx appium driver list

      - name: Create .env file for BrowserStack
        run: |
          echo "BROWSERSTACK_USERNAME=${{ secrets.BROWSERSTACK_USERNAME }}" >> .env
          echo "BROWSERSTACK_ACCESS_KEY=${{ secrets.BROWSERSTACK_ACCESS_KEY }}" >> .env
          echo "BROWSERSTACK_ANDROID_APP_ID=${{ secrets.BROWSERSTACK_ANDROID_APP_ID }}" >> .env

      - name: Run Android tests on BrowserStack
        shell: bash
        run: |
          set -o pipefail
          npm run test:android:bs 2>&1 | tee test-output.log

      - name: Add BrowserStack build link to summary
        if: always()
        run: |
          echo "### BrowserStack App Automate" >> "$GITHUB_STEP_SUMMARY"
          BS_LINK=$(grep -oE 'https://automation\.browserstack\.com/builds/[a-zA-Z0-9]+' test-output.log | tail -1)
          if [ -n "$BS_LINK" ]; then
            echo "[View build report on BrowserStack]($BS_LINK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No BrowserStack build link found in test output._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-android
          path: allure-report/
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-android
          path: reporters/
          retention-days: 30

  publish-reports:
    name: Publish Test Reports
    runs-on: ubuntu-latest
    needs: [test-browserstack-android]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Android Allure Report
        uses: actions/download-artifact@v8
        with:
          name: allure-report-android
          path: allure-report-android/
        continue-on-error: true

      - name: Deploy report to Github Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report-android
        continue-on-error: true
